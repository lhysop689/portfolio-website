<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {
  --bg: #f8f4ee;
  --surface: #ffffff;
  --border: #e3dccd;
  --accent: #9a3d2c;
  --text: #1e1a16;
  --text-dim: #6b6459;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-size: 18px;
}
.wrap { max-width: 700px; margin: 0 auto; padding: 0 24px; }

header {
  border-bottom: 1px solid var(--border);
  padding: 30px 0;
}
header .wrap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.site-name {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 19px;
  color: var(--text);
  text-decoration: none;
}
nav a {
  font-family: var(--mono);
  color: var(--text-dim);
  text-decoration: none;
  margin-left: 22px;
  font-size: 13px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding-bottom: 2px;
  border-bottom: 1px solid transparent;
}
nav a:first-child { margin-left: 0; }
nav a:hover, nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

main { padding: 56px 0 40px; }

h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
.tagline {
  font-family: var(--mono);
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin: 0 0 36px;
}
p { margin: 0 0 18px; }
h2 {
  font-size: 20px;
  font-weight: 600;
  margin: 44px 0 14px;
}
h2:first-child { margin-top: 0; }
ul { margin: 0 0 18px; padding-left: 20px; }
li { margin-bottom: 6px; }
a.inline { color: var(--accent); }

.project {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 22px 24px;
  margin-bottom: 20px;
}
.project h3 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.status {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 2px 8px;
  margin-bottom: 12px;
}
.project p { margin-bottom: 10px; font-size: 16px; }
.project .meta {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--text-dim);
}
.project .meta strong { color: var(--text); font-weight: 600; }
.project a.links { margin-top: 6px; display: block; font-size: 13px; }

footer {
  border-top: 1px solid var(--border);
  margin-top: 40px;
  padding: 24px 0 48px;
  color: var(--text-dim);
  font-size: 14px;
}
footer a { color: var(--text-dim); margin-right: 16px; text-decoration: none; }
footer a:hover { color: var(--accent); }
.copyright { margin-top: 12px; font-family: var(--mono); font-size: 12px; }

.note {
  background: #fdf3e0;
  border: 1px solid #ecd8a8;
  padding: 10px 14px;
  font-size: 13.5px;
  font-family: var(--mono);
  color: #6b5420;
  margin-bottom: 32px;
}
</style>
